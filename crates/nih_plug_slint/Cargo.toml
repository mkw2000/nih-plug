[package]
name = "nih_plug_slint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Slint editor adapter for NIH-plug using baseview and FemtoVG"

[dependencies]
nih_plug = { path = "../nih_plug" }
baseview = { workspace = true, features = ["opengl"] }
crossbeam.workspace = true
raw-window-handle = "0.6"
keyboard-types = { version = "0.6.2", default-features = false }
once_cell = "1.21"
serde.workspace = true
slint = { version = "1.16.1", default-features = false, features = [
    "std",
    "renderer-femtovg",
    "raw-window-handle-06",
    "compat-1-2",
] }
i-slint-renderer-femtovg = { version = "1.16.1", features = ["opengl"] }

[features]
default = []
